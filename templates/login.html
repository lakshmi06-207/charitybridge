<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CharityBridge | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            overflow: hidden;

            /*
             ==========================================
             YOUR LOGIN BACKGROUND
             ==========================================
            */

            background-image:
                linear-gradient(
                    rgba(5, 15, 25, 0.04),
                    rgba(5, 15, 25, 0.04)
                ),
                url("/static/images/login.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            background-attachment: fixed;
        }


        /* ==========================================
           BACKGROUND LIGHT EFFECTS
        ========================================== */

        .light {
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.18;

            pointer-events: none;

            z-index: 0;
        }


        .light-one {
            top: -120px;
            left: -80px;

            background: white;
        }


        .light-two {
            right: -100px;
            top: 25%;

            background: #75e5ff;
        }


        .light-three {
            bottom: -140px;
            left: 30%;

            background: #7dffd5;
        }


        /* ==========================================
           TOP BRAND
        ========================================== */

        .brand {

            position: fixed;

            top: 28px;
            left: 35px;

            z-index: 10;

            display: flex;

            align-items: center;

            gap: 11px;

            font-size: 20px;

            font-weight: 800;

            letter-spacing: -0.5px;

            text-shadow:
                0 4px 20px
                rgba(0,0,0,0.25);
        }


        .brand-icon {

            width: 43px;
            height: 43px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.25);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            box-shadow:
                inset 0 1px 2px
                rgba(255,255,255,0.30);
        }


        /* ==========================================
           MAIN LOGIN AREA
        ========================================== */

        .page {

            position: relative;

            z-index: 2;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;
        }


        /* ==========================================
           LOGIN GLASS
        ========================================== */

        .login-card {

            position: relative;

            width: 430px;

            max-width: 100%;

            padding: 38px;

            border-radius: 30px;

            /*
             VERY THIN GLASS
             Background remains visible
            */

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.25);

            backdrop-filter:
                blur(14px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(14px)
                saturate(125%);

            box-shadow:

                0 30px 80px
                rgba(0,0,0,0.20),

                inset 0 1px 1px
                rgba(255,255,255,0.32),

                inset 0 -1px 1px
                rgba(255,255,255,0.04);

            overflow: hidden;

            animation:
                loginAppear
                0.9s
                ease
                forwards;
        }


        @keyframes loginAppear {

            from {

                opacity: 0;

                transform:
                    translateY(35px)
                    scale(0.96);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /*
          Glass reflection
        */

        .login-card::before {

            content: "";

            position: absolute;

            width: 240px;
            height: 240px;

            top: -150px;
            left: -90px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.14);

            filter:
                blur(55px);

            pointer-events: none;
        }


        /*
          Thin top reflection
        */

        .login-card::after {

            content: "";

            position: absolute;

            top: 0;

            left: 10%;

            width: 80%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.55),
                    transparent
                );

            pointer-events: none;
        }


        /* ==========================================
           LOGIN HEADER
        ========================================== */

        .login-header {

            position: relative;

            z-index: 2;

            text-align: center;

            margin-bottom: 28px;
        }


        .login-logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 23px;

            font-size: 32px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.25);

            box-shadow:

                inset 0 1px 2px
                rgba(255,255,255,0.35),

                0 10px 35px
                rgba(0,0,0,0.12);

            animation:
                logoFloat
                4s
                ease-in-out
                infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        .login-header h1 {

            font-size: 30px;

            margin-bottom: 8px;

            letter-spacing: -1px;
        }


        .gradient-text {

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c9ffef,
                    #c9edff
                );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color:
                transparent;
        }


        .login-header p {

            font-size: 13px;

            color:
                rgba(255,255,255,0.67);

            line-height: 1.6;
        }


        /* ==========================================
           FORM
        ========================================== */

        .login-form {

            position: relative;

            z-index: 2;
        }


        .form-group {

            margin-bottom: 18px;
        }


        .form-label {

            display: block;

            font-size: 11px;

            margin-bottom: 8px;

            color:
                rgba(255,255,255,0.75);
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 16px;

            opacity: 0.72;

            pointer-events: none;
        }


        .input {

            width: 100%;

            height: 52px;

            padding:
                0 45px;

            border-radius: 15px;

            border:
                1px solid
                rgba(255,255,255,0.16);

            outline: none;

            background:
                rgba(255,255,255,0.035);

            color: white;

            font-size: 13px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            transition:
                0.3s;
        }


        .input::placeholder {

            color:
                rgba(255,255,255,0.40);
        }


        .input:focus {

            border-color:
                rgba(255,255,255,0.40);

            background:
                rgba(255,255,255,0.08);

            box-shadow:
                0 0 22px
                rgba(255,255,255,0.05);
        }


        /* PASSWORD BUTTON */

        .password-toggle {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: white;

            opacity: 0.55;

            cursor: pointer;

            font-size: 15px;
        }


        .password-toggle:hover {

            opacity: 1;
        }


        /* ==========================================
           OPTIONS
        ========================================== */

        .options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-top: -2px;

            margin-bottom: 20px;

            font-size: 11px;
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color:
                rgba(255,255,255,0.65);

            cursor: pointer;
        }


        .remember input {

            accent-color:
                #d6fff0;

            cursor: pointer;
        }


        .forgot {

            color:
                rgba(255,255,255,0.82);

            text-decoration: none;

            transition:
                0.3s;
        }


        .forgot:hover {

            color: white;
        }


        /* ==========================================
           LOGIN BUTTON
        ========================================== */

        .login-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 16px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 800;

            color: #10201d;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.97),
                    rgba(207,255,239,0.88)
                );

            box-shadow:
                0 13px 32px
                rgba(0,0,0,0.18);

            transition:
                0.3s;
        }


        .login-button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 20px 42px
                rgba(0,0,0,0.23);
        }


        .login-button:active {

            transform:
                translateY(0);
        }


        /* ==========================================
           DIVIDER
        ========================================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color:
                rgba(255,255,255,0.45);

            font-size: 10px;
        }


        .divider-line {

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,0.13);
        }


        /* ==========================================
           REGISTER
        ========================================== */

        .register {

            text-align: center;

            font-size: 12px;

            color:
                rgba(255,255,255,0.62);
        }


        .register a {

            color: white;

            font-weight: bold;

            text-decoration: none;

            margin-left: 5px;

            transition:
                0.3s;
        }


        .register a:hover {

            color:
                #caffed;
        }


        /* ==========================================
           SECURITY
        ========================================== */

        .security {

            text-align: center;

            margin-top: 20px;

            font-size: 10px;

            color:
                rgba(255,255,255,0.42);
        }


        /* ==========================================
           ERROR MESSAGE
        ========================================== */

        .error-message {

            position: relative;

            z-index: 3;

            margin-bottom: 15px;

            padding: 11px 13px;

            border-radius: 12px;

            background:
                rgba(255,80,80,0.10);

            border:
                1px solid
                rgba(255,150,150,0.20);

            color:
                rgba(255,225,225,0.90);

            font-size: 11px;

            text-align: center;
        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
            }


            .brand {

                top: 18px;

                left: 18px;

                font-size: 17px;
            }


            .brand-icon {

                width: 38px;

                height: 38px;
            }


            .page {

                padding:
                    100px 18px 30px;
            }


            .login-card {

                padding: 27px 21px;

                border-radius: 25px;
            }


            .login-header h1 {

                font-size: 26px;
            }

        }

    </style>
</head>


<body>


    <!-- ==========================================
         BACKGROUND LIGHTS
    ========================================== -->

    <div class="light light-one"></div>

    <div class="light light-two"></div>

    <div class="light light-three"></div>



    <!-- ==========================================
         BRAND
    ========================================== -->

    <div class="brand">

        <div class="brand-icon">
            ♡
        </div>

        <span>
            CharityBridge
        </span>

    </div>



    <!-- ==========================================
         LOGIN PAGE
    ========================================== -->

    <main class="page">


        <section class="login-card">


            <!-- HEADER -->

            <div class="login-header">

                <div class="login-logo">
                    ♡
                </div>


                <h1>
                    Welcome <span class="gradient-text">Back</span>
                </h1>


                <p>
                    Continue your journey of making
                    a difference.
                </p>

            </div>



            <!--
                Flask error message
                This works if your Flask app sends
                an "error" variable.
            -->

            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}



            <!-- LOGIN FORM -->

            <form
                class="login-form"
                method="POST"
                action="/login">


                <!-- EMAIL -->

                <div class="form-group">

                    <label class="form-label">
                        Email Address
                    </label>


                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>


                        <input
                            type="email"
                            name="email"
                            class="input"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label class="form-label">
                        Password
                    </label>


                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>


                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password">

                            ◉

                        </button>

                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        Remember me

                    </label>


                    <a
                        href="#"
                        class="forgot">

                        Forgot password?

                    </a>

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button">

                    Login to CharityBridge

                </button>


            </form>



            <!-- DIVIDER -->

            <div class="divider">

                <span class="divider-line"></span>

                <span>
                    NEW TO CHARITYBRIDGE?
                </span>

                <span class="divider-line"></span>

            </div>



            <!-- REGISTER -->

            <div class="register">

                Create your account

                <a href="/register">
                    Register
                </a>

            </div>



            <!-- SECURITY -->

            <div class="security">

                🔒 Secure community access

            </div>


        </section>

    </main>



    <!-- ==========================================
         JAVASCRIPT
    ========================================== -->

    <script>


        function togglePassword() {

            const password =
                document.getElementById(
                    "password"
                );


            if (
                password.type === "password"
            ) {

                password.type =
                    "text";

            }

            else {

                password.type =
                    "password";

            }

        }

    </script>

</body>
</html>
